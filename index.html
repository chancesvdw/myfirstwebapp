<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Counter App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        pulseBump: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.12)' },
                        },
                        popIn: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    },
                    animation: {
                        pulseBump: 'pulseBump 0.2s ease-in-out',
                        popIn: 'popIn 0.2s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn-press {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active {
            transform: scale(0.92);
        }
        /* Hide scrollbars for clean presentation while keeping scroll functional */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col justify-between transition-colors duration-300">

    <!-- Header Navigation -->
    <header class="w-full max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-calculator text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Counter</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Simple, sleek & interactive</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Sound Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleSound()" title="Toggle Sound"
                class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all btn-press shadow-sm">
                <i id="soundIcon" class="fa-solid fa-volume-high text-base"></i>
            </button>

            <!-- Dark Mode Toggle -->
            <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme"
                class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all btn-press shadow-sm">
                <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-lg mx-auto px-4 py-2 flex-grow flex flex-col justify-center">

        <!-- Notification Toast -->
        <div id="toast" class="hidden transform transition-all duration-300 mb-4 px-4 py-2.5 rounded-xl bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium shadow-xl text-center items-center justify-center space-x-2">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
            <span id="toastMessage">Notification message</span>
        </div>

        <!-- Main Counter Display Card -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-700/80 shadow-2xl shadow-indigo-500/5 relative overflow-hidden transition-all">
            
            <!-- Target / Status Badge -->
            <div class="flex justify-between items-center mb-6">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200/50 dark:border-indigo-800/50">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 mr-2 animate-pulse"></span>
                    Step: <span id="stepDisplay" class="ml-1 font-bold">1</span>
                </span>
                
                <button onclick="saveToHistory()" title="Save Count" 
                    class="text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50">
                    <i class="fa-solid fa-bookmark"></i>
                    Save Stamp
                </button>
            </div>

            <!-- Numerical Display -->
            <div class="my-6 text-center">
                <div id="counterContainer" class="inline-block transition-transform duration-150">
                    <span id="counterValue" class="text-7xl sm:text-8xl font-extrabold tracking-tight text-slate-900 dark:text-white select-none">
                        0
                    </span>
                </div>
            </div>

            <!-- Main Increment / Decrement Controls -->
            <div class="grid grid-cols-3 gap-3 sm:gap-4 mt-8">
                <!-- Decrement Button -->
                <button onclick="changeCount(-1)" 
                    class="btn-press flex flex-col items-center justify-center py-5 sm:py-6 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold shadow-lg shadow-rose-500/25 active:shadow-none transition-all">
                    <i class="fa-solid fa-minus text-2xl mb-1"></i>
                    <span class="text-xs uppercase tracking-wider font-semibold opacity-90">Decrease</span>
                </button>

                <!-- Reset Button -->
                <button onclick="resetCount()" 
                    class="btn-press flex flex-col items-center justify-center py-5 sm:py-6 rounded-2xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold transition-all">
                    <i class="fa-solid fa-rotate-left text-xl mb-1"></i>
                    <span class="text-xs uppercase tracking-wider font-semibold opacity-80">Reset</span>
                </button>

                <!-- Increment Button -->
                <button onclick="changeCount(1)" 
                    class="btn-press flex flex-col items-center justify-center py-5 sm:py-6 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold shadow-lg shadow-emerald-500/25 active:shadow-none transition-all">
                    <i class="fa-solid fa-plus text-2xl mb-1"></i>
                    <span class="text-xs uppercase tracking-wider font-semibold opacity-90">Increase</span>
                </button>
            </div>

            <!-- Quick Step Selector -->
            <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700/60">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 text-center">
                    Quick Step Increment
                </label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setStep(1)" id="stepBtn-1" class="step-btn py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-500 transition-all">
                        +1
                    </button>
                    <button onclick="setStep(5)" id="stepBtn-5" class="step-btn py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-500 transition-all">
                        +5
                    </button>
                    <button onclick="setStep(10)" id="stepBtn-10" class="step-btn py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-500 transition-all">
                        +10
                    </button>
                    <button onclick="setStep(100)" id="stepBtn-100" class="step-btn py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-500 transition-all">
                        +100
                    </button>
                </div>
            </div>
        </div>

        <!-- Saved Stumps / History Section -->
        <div class="mt-6 bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left text-slate-400 text-sm"></i>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        Saved Milestones
                    </h2>
                </div>
                <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition-colors">
                    Clear Log
                </button>
            </div>

            <div id="historyList" class="max-h-36 overflow-y-auto space-y-2 pr-1 no-scrollbar">
                <!-- Log entries dynamically populated here -->
                <p id="emptyHistoryText" class="text-xs text-slate-400 dark:text-slate-500 italic text-center py-3">
                    No saved counts yet. Click "Save Stamp" to record values.
                </p>
            </div>
        </div>

        <!-- Keyboard Shortcut Hint -->
        <div class="mt-4 text-center">
            <p class="text-xs text-slate-400 dark:text-slate-500">
                <span class="inline-block px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-mono">Space</span> or <span class="inline-block px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-mono">↑</span> / <span class="inline-block px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-mono">↓</span> to adjust &bull; <span class="inline-block px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-mono">R</span> to reset
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400 dark:text-slate-600">
        Simple Counter App &bull; Local Storage Enabled
    </footer>

    <script>
        // App State
        let count = 0;
        let step = 1;
        let soundEnabled = true;
        let history = [];

        // DOM Elements
        const counterValueEl = document.getElementById('counterValue');
        const counterContainerEl = document.getElementById('counterContainer');
        const stepDisplayEl = document.getElementById('stepDisplay');
        const historyListEl = document.getElementById('historyList');
        const emptyHistoryTextEl = document.getElementById('emptyHistoryText');
        const soundIconEl = document.getElementById('soundIcon');
        const themeIconEl = document.getElementById('themeIcon');
        const toastEl = document.getElementById('toast');
        const toastMessageEl = document.getElementById('toastMessage');

        // Web Audio API Synth for Sound Effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(frequency = 440, type = 'sine', duration = 0.08) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio fallback silence
            }
        }

        // Initialize state from LocalStorage
        function initApp() {
            // Load count
            const savedCount = localStorage.getItem('counter_value');
            if (savedCount !== null) {
                count = parseInt(savedCount, 10) || 0;
            }

            // Load step
            const savedStep = localStorage.getItem('counter_step');
            if (savedStep !== null) {
                step = parseInt(savedStep, 10) || 1;
            }

            // Load sound preference
            const savedSound = localStorage.getItem('counter_sound');
            if (savedSound !== null) {
                soundEnabled = savedSound === 'true';
            }

            // Load theme
            const savedTheme = localStorage.getItem('counter_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            // Load History
            const savedHistory = localStorage.getItem('counter_history');
            if (savedHistory) {
                try {
                    history = JSON.parse(savedHistory);
                } catch (e) {
                    history = [];
                }
            }

            updateUI();
            updateSoundUI();
            updateThemeUI();
            renderHistory();
        }

        // Update Counter Display
        function updateUI(animate = false) {
            counterValueEl.textContent = count.toLocaleString();
            stepDisplayEl.textContent = step;

            // Highlight current active step preset button
            document.querySelectorAll('.step-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
            });
            const activeStepBtn = document.getElementById(`stepBtn-${step}`);
            if (activeStepBtn) {
                activeStepBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
            }

            // Trigger small bounce animation
            if (animate) {
                counterContainerEl.classList.remove('animate-pulseBump');
                void counterContainerEl.offsetWidth; // Force reflow
                counterContainerEl.classList.add('animate-pulseBump');
            }

            // Save state
            localStorage.setItem('counter_value', count);
            localStorage.setItem('counter_step', step);
        }

        // Modify Count
        function changeCount(direction) {
            const delta = direction * step;
            count += delta;

            // Sound tone based on direction
            if (direction > 0) {
                playSound(520 + Math.min(count * 2, 400), 'sine', 0.07);
            } else {
                playSound(340 - Math.min(Math.abs(count), 150), 'sine', 0.07);
            }

            updateUI(true);
        }

        // Reset Count
        function resetCount() {
            if (count === 0) return;
            count = 0;
            playSound(220, 'triangle', 0.15);
            updateUI(true);
            showToast("Counter reset to 0");
        }

        // Set Custom Step Value
        function setStep(newStep) {
            step = newStep;
            playSound(600, 'sine', 0.05);
            updateUI(false);
            showToast(`Step set to ${step}`);
        }

        // History Management
        function saveToHistory() {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const item = { value: count, time: timeStr, id: Date.now() };
            history.unshift(item);
            
            // Limit to 10 entries
            if (history.length > 10) history.pop();

            localStorage.setItem('counter_history', JSON.stringify(history));
            renderHistory();
            playSound(750, 'sine', 0.1);
            showToast(`Saved timestamp: ${count.toLocaleString()}`);
        }

        function renderHistory() {
            if (history.length === 0) {
                emptyHistoryTextEl.classList.remove('hidden');
                historyListEl.querySelectorAll('.history-item').forEach(el => el.remove());
                return;
            }

            emptyHistoryTextEl.classList.add('hidden');
            
            // Re-render history entries
            const existingItems = historyListEl.querySelectorAll('.history-item');
            existingItems.forEach(el => el.remove());

            history.forEach(item => {
                const row = document.createElement('div');
                row.className = 'history-item flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-700/40 text-xs animate-popIn';
                row.innerHTML = `
                    <span class="font-bold text-slate-800 dark:text-slate-200">${item.value.toLocaleString()}</span>
                    <span class="text-slate-400 dark:text-slate-500">${item.time}</span>
                `;
                historyListEl.appendChild(row);
            });
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('counter_history');
            renderHistory();
            showToast("History log cleared");
        }

        // Sound Toggle
        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('counter_sound', soundEnabled);
            updateSoundUI();
            if (soundEnabled) playSound(500, 'sine', 0.08);
            showToast(soundEnabled ? "Sound enabled" : "Sound muted");
        }

        function updateSoundUI() {
            if (soundEnabled) {
                soundIconEl.className = "fa-solid fa-volume-high text-indigo-600 dark:text-indigo-400";
            } else {
                soundIconEl.className = "fa-solid fa-volume-xmark text-slate-400";
            }
        }

        // Theme Toggle
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('counter_theme', isDark ? 'dark' : 'light');
            updateThemeUI();
        }

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                themeIconEl.className = "fa-solid fa-sun text-amber-400";
            } else {
                themeIconEl.className = "fa-solid fa-moon text-slate-600";
            }
        }

        // Show Toast Feedback
        let toastTimeout = null;
        function showToast(msg) {
            toastMessageEl.textContent = msg;
            toastEl.classList.remove('hidden');
            toastEl.classList.add('flex');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('hidden');
                toastEl.classList.remove('flex');
            }, 2000);
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            // Prevent default page scrolling for space & arrows when interacting
            if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
                e.preventDefault();
            }

            if (e.code === 'Space' || e.code === 'ArrowUp') {
                changeCount(1);
            } else if (e.code === 'ArrowDown') {
                changeCount(-1);
            } else if (e.code === 'KeyR') {
                resetCount();
            } else if (e.code === 'KeyS') {
                saveToHistory();
            }
        });

        // Initialize application on page load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
